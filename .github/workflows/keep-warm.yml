name: Keep Render demos warm

# Render's free plan sleeps a service after 15 min without traffic.
# Ping every 10 min, Mon-Fri 08:00-18:00 Costa Rica time (UTC-6) = 14:00-23:59 UTC.
# Do NOT widen this window: the 750 free instance hours/month are shared by the
# whole Render account (3 services x ~10 h x ~22 days ≈ 660 h).
on:
  schedule:
    - cron: "*/10 14-23 * * 1-5"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping health endpoints
        shell: bash
        run: |
          urls=(
            "https://pokedex-backend-lx85.onrender.com/health"
            "https://lvbuild-api.onrender.com/health"
            "https://fitros-api.onrender.com/health"
          )

          ping() {
            local url="$1" code
            code=$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' \
              --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
              "$url") || code="000"
            if [[ "$code" =~ ^2 ]]; then
              echo "OK   $code  $url"
            else
              echo "::warning title=Keep-warm ping failed::$url returned $code"
            fi
          }

          # In parallel, so a slow cold start does not delay the others.
          for url in "${urls[@]}"; do ping "$url" & done
          wait
          # A failed ping is reported as a warning, never as a failed run.
          exit 0
